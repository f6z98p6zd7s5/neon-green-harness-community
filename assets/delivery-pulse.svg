<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Neon Green contribution frequency</title>
  <desc id="desc">Seven-day repository delivery pulse showing 17 checkpoints on August 26 and 3 on August 30, 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050706"/><stop offset="1" stop-color="#07130d"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#00a96b"/><stop offset="1" stop-color="#39ff14"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#39ff14" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="26" fill="url(#grid)"/>
  <text x="44" y="48" fill="#39ff14" font-family="Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">NEON GREEN CONTRIBUTION PULSE</text>
  <text x="44" y="79" fill="#9ba99d" font-family="Arial,sans-serif" font-size="15">Versioned product checkpoints // 7-day snapshot // 2026-08-30</text>
  <line x1="46" y1="252" x2="830" y2="252" stroke="#a2ff90" stroke-opacity=".18"/>
  <g fill="#0d2116" stroke="#39ff14" stroke-opacity=".18">
    <rect x="70" y="238" width="72" height="14" rx="7"/><rect x="174" y="238" width="72" height="14" rx="7"/>
    <rect x="278" y="102" width="72" height="150" rx="10" fill="url(#bar)" filter="url(#glow)" stroke-opacity=".9"/>
    <rect x="382" y="238" width="72" height="14" rx="7"/><rect x="486" y="238" width="72" height="14" rx="7"/>
    <rect x="590" y="238" width="72" height="14" rx="7"/>
    <rect x="694" y="218" width="72" height="34" rx="8" fill="url(#bar)" filter="url(#glow)" stroke-opacity=".8"/>
  </g>
  <g fill="#839288" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">
    <text x="106" y="279">AUG 24</text><text x="210" y="279">25</text><text x="314" y="279">26</text>
    <text x="418" y="279">27</text><text x="522" y="279">28</text><text x="626" y="279">29</text><text x="730" y="279">30</text>
  </g>
  <text x="314" y="91" fill="#dffff0" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">17</text>
  <text x="730" y="207" fill="#dffff0" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">3</text>
  <line x1="882" y1="42" x2="882" y2="276" stroke="#39ff14" stroke-opacity=".16"/>
  <text x="928" y="116" fill="#f0fff5" font-family="Arial,sans-serif" font-size="54" font-weight="800">20+</text>
  <text x="930" y="143" fill="#39ff14" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">CHECKPOINTS</text>
  <text x="928" y="201" fill="#f0fff5" font-family="Arial,sans-serif" font-size="32" font-weight="800">01.00</text>
  <text x="930" y="226" fill="#9ba99d" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.5">CURRENT LEVEL</text>
  <text x="930" y="270" fill="#738078" font-family="Arial,sans-serif" font-size="11">Counts only; no private repository details.</text>
</svg>
